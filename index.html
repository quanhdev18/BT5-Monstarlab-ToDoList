<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>BT5 Monstarlab</title>
  </head>
  <body>
    <div class="container">
      <form id="todo-form" class="formContainer" method="" action="">
        <h1 class="title">Todo List</h1>
        <input type="text" id="todo-title" class="input" placeholder="Tiêu đề công việc" />
        <textarea id="todo-description" class="input" placeholder="Mô tả"></textarea>
        <button type="submit" class="addButton">Thêm mới</button>
      </form>

      <div class="advanceContainer">
        <input
          type="search"
          id="search-input"
          class="inputSearch"
          placeholder="Tìm kiếm theo tiêu đề"
        />
        <select class="selectFilter" id="filter-status">
          <option value="all">Tất cả</option>
          <option value="todo">chưa làm</option>
          <option value="progress">Đang làm</option>
          <option value="done">Hoàn thành</option>
        </select>
        <button id="search-button">Tìm kiếm</button>
      </div>

      <div>
        <table class="todoTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tiêu đề</th>
              <th>Mô tả</th>
              <th>Trạng thái</th>
              <th>Ngày tạo</th>
              <th>Ngày cập nhật</th>
            </tr>
          </thead>
          <tbody id="todo-list-body"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="prev-page" disabled>Trước</button>
        <span id="current-page-text">Trang 1</span>
        <button id="next-page">Sau</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
